name: Sync meetings and events

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Fetch and copy meeting PDFs
        run: |
          meetings_source="${RUNNER_TEMP}/sigarch-meetings"
          git clone --depth 1 https://github.com/uiuc-sigarch/meetings.git "$meetings_source"
          node scripts/sync-meetings.mjs "$meetings_source"

      - name: Generate event index
        run: node scripts/sync-events.mjs

      - name: Commit synchronized PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meetings meetings.json events.json
          if git diff --cached --quiet; then
            echo "Meetings and events are already up to date."
          else
            git commit -m "Sync meetings and events"
            git push
          fi
