name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Fetch meeting PDFs for the build
      run: |
        meetings_source="${RUNNER_TEMP}/sigarch-meetings"
        git clone --depth 1 https://github.com/uiuc-sigarch/meetings.git "$meetings_source"
        node scripts/sync-meetings.mjs "$meetings_source"
        node scripts/sync-events.mjs
    - name: Build the site in the jekyll/builder container
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
